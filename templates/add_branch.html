{% extends "base.html" %}

{% block title %}Add Branch{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Add Branch</h1>
    <a href="{{ url_for('branches') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Back to Branches
    </a>
</div>

<div class="card">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Branch Information</h5>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="name">Branch Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="branch_code">Branch Code <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="branch_code" name="branch_code" required>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="firm_id">Firm <span class="text-danger">*</span></label>
                        <select class="form-control" id="firm_id" name="firm_id" required>
                            <option value="">Select Firm</option>
                            {% for firm in firms %}
                            <option value="{{ firm.id }}">{{ firm.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="manager_id">Manager</label>
                        <select class="form-control" id="manager_id" name="manager_id">
                            <option value="">Select Manager</option>
                            {% for manager in managers %}
                            <option value="{{ manager.id }}">{{ manager.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="address">Address <span class="text-danger">*</span></label>
                <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="phone">Phone <span class="text-danger">*</span></label>
                        <input type="tel" class="form-control" id="phone" name="phone" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="email">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Save Branch
                </button>
                <a href="{{ url_for('branches') }}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
