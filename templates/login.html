{% extends "base.html" %} {% block title %}Login - Law Firm Management System{%
endblock %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-6">
    <div class="card shadow">
      <div class="card-header bg-primary text-white text-center">
        <h4><i class="fas fa-balance-scale me-2"></i>LawEdge Login</h4>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
              <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                required
              />
            </div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                required
              />
            </div>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-sign-in-alt me-2"></i>Login
            </button>
          </div>
        </form>
      </div>
      <div class="card-footer text-center">
        <small class="text-muted">
          Law Firm Management System &copy; 2023
        </small>
      </div>
    </div>

    <div class="mt-4">
      <div class="card">
        <div class="card-header">
          <h6>Test Credentials</h6>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-12 mb-2">
              <strong>Admin:</strong> admin / admin123
            </div>
            <div class="col-12 mb-2">
              <strong>Lawyer:</strong> jdoe / lawyer123
            </div>
            <div class="col-12"><strong>Staff:</strong> msmith / staff123</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
